<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>친구 공동 구매 & 지출 관리</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Kakao SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea, button, select {
      user-select: text;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    const INITIAL_USERS = [];
    const TODAY_STR = new Date().toISOString().split('T')[0];
    const INITIAL_REQUESTS = [];
    const INITIAL_APPROVALS = [];
    const INITIAL_EXPENSES = [];

    const DEFAULT_PASSCODE = '1234';

    function App() {
      const [passcode, setPasscode] = useState(() => localStorage.getItem('app_shared_passcode') || DEFAULT_PASSCODE);
      const [isAuthenticated, setIsAuthenticated] = useState(() => sessionStorage.getItem('is_authenticated') === 'true');
      const [supabaseUrl, setSupabaseUrl] = useState(() => localStorage.getItem('supabase_url') || '');
      const [supabaseKey, setSupabaseKey] = useState(() => localStorage.getItem('supabase_key') || '');
      const [kakaoKey, setKakaoKey] = useState(() => localStorage.getItem('kakao_js_key') || '');
      const [supabaseClient, setSupabaseClient] = useState(null);

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('current_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [activeTab, setActiveTab] = useState('home');

      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem('local_users');
        return saved ? JSON.parse(saved) : INITIAL_USERS;
      });
      const [requests, setRequests] = useState(() => {
        const saved = localStorage.getItem('local_requests');
        return saved ? JSON.parse(saved) : INITIAL_REQUESTS;
      });
      const [approvals, setApprovals] = useState(() => {
        const saved = localStorage.getItem('local_approvals');
        return saved ? JSON.parse(saved) : INITIAL_APPROVALS;
      });
      const [expenses, setExpenses] = useState(() => {
        const saved = localStorage.getItem('local_expenses');
        return saved ? JSON.parse(saved) : INITIAL_EXPENSES;
      });

      const [showPassModal, setShowPassModal] = useState(!isAuthenticated);
      const [showUserSelectModal, setShowUserSelectModal] = useState(isAuthenticated && !currentUser);
      const [selectedUserForLogin, setSelectedUserForLogin] = useState(null);
      
      const [showAddRequestModal, setShowAddRequestModal] = useState(false);
      const [showEditRequestModal, setShowEditRequestModal] = useState(null); // 재결재용 수정 모달 state
      const [showAddExpenseModal, setShowAddExpenseModal] = useState(false);
      const [showEditExpenseModal, setShowEditExpenseModal] = useState(null);
      const [showRejectModal, setShowRejectModal] = useState(null);
      const [showDbSettingsModal, setShowDbSettingsModal] = useState(false);
      const [showAddUserModal, setShowAddUserModal] = useState(users.length === 0);
      const [showEditProfileModal, setShowEditProfileModal] = useState(false);

      const [expenseViewMode, setExpenseViewMode] = useState('daily');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedMonth, setSelectedMonth] = useState(TODAY_STR.substring(0, 7));
      const [selectedUserFilter, setSelectedUserFilter] = useState('all');

      useEffect(() => {
        if (kakaoKey && window.Kakao && !window.Kakao.isInitialized()) {
          try {
            window.Kakao.init(kakaoKey);
          } catch(e) {
            console.error("Kakao Init Error:", e);
          }
        }
      }, [kakaoKey]);

      useEffect(() => {
        if (supabaseUrl && supabaseKey && window.supabase) {
          try {
            const client = window.supabase.createClient(supabaseUrl, supabaseKey);
            setSupabaseClient(client);
          } catch (err) {
            console.error("Supabase Init Error:", err);
          }
        } else {
          setSupabaseClient(null);
        }
      }, [supabaseUrl, supabaseKey]);

      useEffect(() => {
        if (!supabaseClient) {
          localStorage.setItem('local_users', JSON.stringify(users));
          localStorage.setItem('local_requests', JSON.stringify(requests));
          localStorage.setItem('local_approvals', JSON.stringify(approvals));
          localStorage.setItem('local_expenses', JSON.stringify(expenses));
        }
      }, [users, requests, approvals, expenses, supabaseClient]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('current_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('current_user');
        }
      }, [currentUser]);

      const fetchSupabaseData = useCallback(async () => {
        if (!supabaseClient) return;
        try {
          const { data: settingsData } = await supabaseClient.from('app_settings').select('*').single();
          if (settingsData && settingsData.shared_password) {
            setPasscode(settingsData.shared_password);
            localStorage.setItem('app_shared_passcode', settingsData.shared_password);
          }

          const { data: uData } = await supabaseClient.from('users').select('*').order('created_at', { ascending: true });
          if (uData) setUsers(uData);

          const { data: rData } = await supabaseClient.from('purchase_requests').select('*').order('created_at', { ascending: false });
          if (rData) setRequests(rData);

          const { data: aData } = await supabaseClient.from('approvals').select('*');
          if (aData) setApprovals(aData);

          const { data: eData } = await supabaseClient.from('expenses').select('*').eq('is_deleted', false).order('date', { ascending: false });
          if (eData) setExpenses(eData);
        } catch (err) {
          console.error("Failed to fetch Supabase data:", err);
        }
      }, [supabaseClient]);

      useEffect(() => {
        if (supabaseClient) {
          fetchSupabaseData();
          const channel = supabaseClient.channel('db-changes')
            .on('postgres_changes', { event: '*', schema: 'public' }, () => {
              fetchSupabaseData();
            })
            .subscribe();

          return () => {
            supabaseClient.removeChannel(channel);
          };
        }
      }, [supabaseClient, fetchSupabaseData]);

      const activeUsers = useMemo(() => users.filter(u => u.is_active), [users]);

      const pendingCountForMe = useMemo(() => {
        if (!currentUser) return 0;
        return requests.filter(req => {
          if (req.status !== 'pending' && req.status !== 'approved') return false;
          if (req.requester_id === currentUser.id) return false;
          const myApproval = approvals.find(a => a.request_id === req.id && a.user_id === currentUser.id);
          return !myApproval || myApproval.status === 'pending';
        }).length;
      }, [requests, approvals, currentUser]);

      const getCalculatedRequestStatus = useCallback((req) => {
        if (req.status === 'purchased') return { code: 'purchased', label: '🔵 구매 완료', color: 'bg-blue-100 text-blue-700 border-blue-300' };
        
        const reqApprovals = approvals.filter(a => a.request_id === req.id);
        const hasRejection = reqApprovals.some(a => a.status === 'rejected');
        if (hasRejection) return { code: 'rejected', label: '🔴 거절됨', color: 'bg-rose-100 text-rose-700 border-rose-300' };

        const requiredApprovers = activeUsers.filter(u => u.id !== req.requester_id);
        const approvedCount = reqApprovals.filter(a => a.status === 'approved' && requiredApprovers.some(u => u.id === a.user_id)).length;

        if (requiredApprovers.length > 0 && approvedCount >= requiredApprovers.length) {
          return { code: 'approved', label: '🟢 승인 완료', color: 'bg-emerald-100 text-emerald-700 border-emerald-300' };
        }

        return { code: 'pending', label: '🟡 승인 대기', color: 'bg-amber-100 text-amber-700 border-amber-300' };
      }, [approvals, activeUsers]);

      const expensesStats = useMemo(() => {
        const todayExpenses = expenses.filter(e => e.date === TODAY_STR && !e.is_deleted);
        const todayTotal = todayExpenses.reduce((sum, e) => sum + Number(e.amount), 0);

        const monthExpenses = expenses.filter(e => e.date.startsWith(selectedMonth) && !e.is_deleted);
        const monthTotal = monthExpenses.reduce((sum, e) => sum + Number(e.amount), 0);

        const perUserMonth = {};
        users.forEach(u => perUserMonth[u.id] = 0);
        monthExpenses.forEach(e => {
          if (perUserMonth[e.user_id] !== undefined) perUserMonth[e.user_id] += Number(e.amount);
        });

        return { todayTotal, monthTotal, todayExpenses, monthExpenses, perUserMonth };
      }, [expenses, selectedMonth, users]);

      const triggerKakaoShare = (req) => {
        const requesterName = users.find(u => u.id === req.requester_id)?.name || '친구';
        if (window.Kakao && window.Kakao.isInitialized()) {
          window.Kakao.Share.sendDefault({
            objectType: 'feed',
            content: {
              title: `🛒 [결재 요청] ${requesterName}님의 구매 요청`,
              description: `• 물품: ${req.content}\n• 금액: ${Number(req.amount).toLocaleString()}원`,
              imageUrl: 'https://cdn-icons-png.flaticon.com/512/2838/2838912.png',
              link: {
                mobileWebUrl: window.location.href,
                webUrl: window.location.href,
              },
            },
            buttons: [
              {
                title: '앱에서 승인하기',
                link: {
                  mobileWebUrl: window.location.href,
                  webUrl: window.location.href,
                },
              },
            ],
          });
        } else {
          const shareText = `🛒 [결재 요청 올라왔어!]\n• 요청자: ${requesterName}\n• 물품: ${req.content}\n• 금액: ${Number(req.amount).toLocaleString()}원\n\n👉 승인하러 가기:\n${window.location.href}`;
          navigator.clipboard.writeText(shareText).then(() => {
            alert('카카오톡 공유 내용이 복사되었습니다!\n단톡방에 붙여넣어 공유해 보세요.');
          });
        }
      };

      const handleAppLogin = (inputPass) => {
        if (inputPass === passcode) {
          setIsAuthenticated(true);
          sessionStorage.setItem('is_authenticated', 'true');
          setShowPassModal(false);
          if (users.length === 0) {
            setShowAddUserModal(true);
          } else if (!currentUser) {
            setShowUserSelectModal(true);
          }
        } else {
          alert('비밀번호가 올바르지 않습니다.');
        }
      };

      const handleUserPersonalLogin = (user, inputPassword) => {
        const userPass = user.password || '1234';
        if (inputPassword === userPass) {
          setCurrentUser(user);
          setSelectedUserForLogin(null);
          setShowUserSelectModal(false);
        } else {
          alert('개인 비밀번호가 올바르지 않습니다.');
        }
      };

      const handleCreateRequest = async (content, amount) => {
        if (!currentUser) return;
        const newReq = {
          id: 'r_' + Date.now(),
          requester_id: currentUser.id,
          content,
          amount: Number(amount),
          date: TODAY_STR,
          status: 'pending',
          created_at: new Date().toISOString()
        };

        if (supabaseClient) {
          const { error } = await supabaseClient.from('purchase_requests').insert([{
            requester_id: currentUser.id,
            content,
            amount: Number(amount),
            date: TODAY_STR,
            status: 'pending'
          }]);
          if (error) return alert('구매 요청 실패: ' + error.message);
          fetchSupabaseData();
        } else {
          const newApprovals = activeUsers
            .filter(u => u.id !== currentUser.id)
            .map(u => ({
              id: 'a_' + Date.now() + '_' + u.id,
              request_id: newReq.id,
              user_id: u.id,
              status: 'pending',
              rejection_reason: ''
            }));

          setRequests(prev => [newReq, ...prev]);
          setApprovals(prev => [...prev, ...newApprovals]);
        }

        setShowAddRequestModal(false);
        
        setTimeout(() => {
          if (confirm('구매 요청이 등록되었습니다!\n단톡방에 카카오톡 메시지로 알리시겠습니까?')) {
            triggerKakaoShare(newReq);
          }
        }, 100);
      };

      // 거절된 요청을 수정하여 재결재 올리는 핸들러
      const handleUpdateRequest = async (reqId, content, amount) => {
        if (!currentUser) return;

        if (supabaseClient) {
          // 1. 요청 내용 업데이트 및 상태를 다시 pending으로 초기화
          const { error: reqError } = await supabaseClient
            .from('purchase_requests')
            .update({
              content,
              amount: Number(amount),
              status: 'pending',
              updated_at: new Date().toISOString()
            })
            .eq('id', reqId);

          if (reqError) return alert('재결재 수정 실패: ' + reqError.message);

          // 2. 기존 거절/승인되었던 투표(approvals) 기록들을 초기화(다시 대기 상태로 변경)
          const { error: appError } = await supabaseClient
            .from('approvals')
            .update({
              status: 'pending',
              rejection_reason: '',
              updated_at: new Date().toISOString()
            })
            .eq('request_id', reqId);

          if (appError) return alert('결재 투표 초기화 실패: ' + appError.message);

          fetchSupabaseData();
        } else {
          setRequests(prev => prev.map(r => r.id === reqId ? { ...r, content, amount: Number(amount), status: 'pending' } : r));
          setApprovals(prev => prev.map(a => a.request_id === reqId ? { ...a, status: 'pending', rejection_reason: '' } : a));
        }

        setShowEditRequestModal(null);
        alert('수정된 내용으로 재결재가 요청되었습니다!');
      };

      const handleCancelRequest = async (req) => {
        if (req.requester_id !== currentUser?.id) {
          alert('본인이 올린 구매 요청만 취소할 수 있습니다.');
          return;
        }

        if (req.status === 'purchased') {
          alert('이미 구매 완료 처리된 요청은 취소할 수 없습니다.');
          return;
        }

        if (!confirm(`'${req.content}' 구매 요청을 정말 취소(삭제)하시겠습니까?`)) return;

        if (supabaseClient) {
          try {
            await supabaseClient.from('approvals').delete().eq('request_id', req.id);
            const { error } = await supabaseClient.from('purchase_requests').delete().eq('id', req.id);
            if (error) throw error;
            fetchSupabaseData();
            alert('구매 요청이 취소되었습니다.');
          } catch (err) {
            console.error("요청 취소 오류:", err);
            alert('요청 취소 실패: ' + err.message);
          }
        } else {
          setRequests(prev => prev.filter(r => r.id !== req.id));
          setApprovals(prev => prev.filter(a => a.request_id !== req.id));
          alert('구매 요청이 취소되었습니다.');
        }
      };

      const handleVoteApproval = async (requestId, status, reason = '') => {
        if (!currentUser) return;

        if (supabaseClient) {
          const { data: existing } = await supabaseClient
            .from('approvals')
            .select('id')
            .eq('request_id', requestId)
            .eq('user_id', currentUser.id)
            .maybeSingle();

          let error;
          if (existing) {
            const res = await supabaseClient.from('approvals').update({
              status,
              rejection_reason: reason,
              updated_at: new Date().toISOString()
            }).eq('id', existing.id);
            error = res.error;
          } else {
            const res = await supabaseClient.from('approvals').insert([{
              request_id: requestId,
              user_id: currentUser.id,
              status,
              rejection_reason: reason
            }]);
            error = res.error;
          }

          if (error) return alert('처리 실패: ' + error.message);
          fetchSupabaseData();
        } else {
          setApprovals(prev => {
            const idx = prev.findIndex(a => a.request_id === requestId && a.user_id === currentUser.id);
            if (idx >= 0) {
              const updated = [...prev];
              updated[idx] = { ...updated[idx], status, rejection_reason: reason };
              return updated;
            }
            return [...prev, { id: 'a_' + Date.now(), request_id: requestId, user_id: currentUser.id, status, rejection_reason: reason }];
          });
        }
        setShowRejectModal(null);
      };

      const handleCompletePurchase = async (req) => {
        if (req.requester_id !== currentUser?.id) {
          alert('결재를 신청한 본인만 실제 구매 완료 처리를 할 수 있습니다.');
          return;
        }

        // 승인 완료 상태인지 철저히 검증 (거절되거나 대기중인 건은 원천 차단)
        const statusInfo = getCalculatedRequestStatus(req);
        if (statusInfo.code !== 'approved') {
          alert('승인 완료된 결재 건만 지출 내역으로 적용할 수 있습니다.');
          return;
        }

        if (!confirm(`'${req.content}' 구매를 완료하고 지출 내역에 등록하시겠습니까?`)) return;

        if (supabaseClient) {
          await supabaseClient.from('purchase_requests').update({ status: 'purchased' }).eq('id', req.id);
          await supabaseClient.from('expenses').insert([{
            user_id: req.requester_id,
            purchase_request_id: req.id,
            content: req.content,
            amount: req.amount,
            date: TODAY_STR,
            memo: '구매 요청 승인 후 구입'
          }]);
          fetchSupabaseData();
        } else {
          setRequests(prev => prev.map(r => r.id === req.id ? { ...r, status: 'purchased' } : r));
          const newExp = {
            id: 'e_' + Date.now(),
            user_id: req.requester_id,
            purchase_request_id: req.id,
            content: req.content,
            amount: req.amount,
            date: TODAY_STR,
            memo: '구매 요청 승인 후 구입',
            is_deleted: false,
            created_at: new Date().toISOString()
          };
          setExpenses(prev => [newExp, ...prev]);
        }
      };

      const handleCreateExpense = async (content, amount, date = TODAY_STR, memo = '') => {
        if (!currentUser) return;

        if (supabaseClient) {
          const { error } = await supabaseClient.from('expenses').insert([{
            user_id: currentUser.id,
            content,
            amount: Number(amount),
            date: date || TODAY_STR,
            memo
          }]);
          if (error) return alert('지출 등록 실패: ' + error.message);
          fetchSupabaseData();
        } else {
          const newExp = {
            id: 'e_' + Date.now(),
            user_id: currentUser.id,
            content,
            amount: Number(amount),
            date: date || TODAY_STR,
            memo,
            is_deleted: false,
            created_at: new Date().toISOString()
          };
          setExpenses(prev => [newExp, ...prev]);
        }
        setShowAddExpenseModal(false);
      };

      const handleUpdateExpense = async (id, content, amount, date, memo) => {
        if (supabaseClient) {
          const { error } = await supabaseClient.from('expenses').update({
            content,
            amount: Number(amount),
            date,
            memo,
            updated_at: new Date().toISOString()
          }).eq('id', id);

          if (error) return alert('수정 실패: ' + error.message);
          fetchSupabaseData();
        } else {
          setExpenses(prev => prev.map(e => e.id === id ? { ...e, content, amount: Number(amount), date, memo } : e));
        }
        setShowEditExpenseModal(null);
      };

      const handleDeleteExpense = async (id) => {
        if (!confirm('정말 삭제하시겠습니까?')) return;

        if (supabaseClient) {
          const { error } = await supabaseClient.from('expenses').update({ is_deleted: true }).eq('id', id);
          if (error) return alert('삭제 실패: ' + error.message);
          fetchSupabaseData();
        } else {
          setExpenses(prev => prev.map(e => e.id === id ? { ...e, is_deleted: true } : e));
        }
      };

      const handleUpdateMyProfile = async (newName, newPassword) => {
        if (!currentUser) return;
        if (!newName.trim()) return alert('이름을 입력해 주세요.');

        if (supabaseClient) {
          const { error } = await supabaseClient.from('users').update({
            name: newName.trim(),
            password: newPassword.trim() || '1234'
          }).eq('id', currentUser.id);

          if (error) return alert('수정 실패: ' + error.message);
          fetchSupabaseData();
        } else {
          setUsers(prev => prev.map(u => u.id === currentUser.id ? {
            ...u,
            name: newName.trim(),
            password: newPassword.trim() || '1234'
          } : u));
        }

        const updatedUser = { ...currentUser, name: newName.trim(), password: newPassword.trim() || '1234' };
        setCurrentUser(updatedUser);
        setShowEditProfileModal(false);
        alert('프로필 및 개인 비밀번호가 변경되었습니다!');
      };

      const handleAddUser = async (name, initialPass) => {
        if (!name.trim()) return;
        const newUserId = 'u_' + Date.now();
        const newUserObj = {
          id: newUserId,
          name: name.trim(),
          password: initialPass.trim() || '1234',
          is_active: true
        };

        if (supabaseClient) {
          const { error } = await supabaseClient.from('users').insert([newUserObj]);
          if (error) return alert('추가 실패: ' + error.message);
          fetchSupabaseData();
        } else {
          setUsers(prev => [...prev, newUserObj]);
        }

        if (!currentUser) {
          setCurrentUser(newUserObj);
        }

        setShowAddUserModal(false);

        const nextActive = !user.is_active;
        if (supabaseClient) {
          await supabaseClient.from('users').update({ is_active: nextActive }).eq('id', user.id);
          fetchSupabaseData();
        } else {
          setUsers(prev => prev.map(u => u.id === user.id ? { ...u, is_active: nextActive } : u));
        }
      };

      const handleDeleteUser = async (user) => {
        if (users.length <= 1) {
          alert('최소 1명의 사용자는 남아있어야 합니다.');
          return;
        }
        if (!confirm(`정말 '${user.name}' 사용자를 삭제하시겠습니까?\n(해당 사용자의 지출, 구매 요청 및 관련 승인 내역이 모두 함께 삭제됩니다.)`)) return;

        if (supabaseClient) {
          try {
            const { data: myReqs } = await supabaseClient
              .from('purchase_requests')
              .select('id')
              .eq('requester_id', user.id);
            
            const myReqIds = myReqs ? myReqs.map(r => r.id) : [];

            if (myReqIds.length > 0) {
              await supabaseClient.from('approvals').delete().in('request_id', myReqIds);
              await supabaseClient.from('expenses').delete().in('purchase_request_id', myReqIds);
            }

            await supabaseClient.from('purchase_requests').delete().eq('requester_id', user.id);
            await supabaseClient.from('approvals').delete().eq('user_id', user.id);
            await supabaseClient.from('expenses').delete().eq('user_id', user.id);

            const { error } = await supabaseClient.from('users').delete().eq('id', user.id);
            if (error) throw error;

            fetchSupabaseData();
            alert(`'${user.name}'님과 관련된 모든 지출 및 결재 내역이 삭제되었습니다.`);
          } catch (err) {
            console.error("사용자 삭제 오류:", err);
            alert('사용자 삭제 실패: ' + err.message);
          }
        } else {
          setUsers(prev => prev.filter(u => u.id !== user.id));
          const myReqIds = requests.filter(r => r.requester_id === user.id).map(r => r.id);
          setExpenses(prev => prev.filter(e => e.user_id !== user.id && !myReqIds.includes(e.purchase_request_id)));
          setRequests(prev => prev.filter(r => r.requester_id !== user.id));
          setApprovals(prev => prev.filter(a => a.user_id !== user.id && !myReqIds.includes(a.request_id)));
        }

        if (currentUser?.id === user.id) {
          setCurrentUser(null);
          localStorage.removeItem('current_user');
          setShowUserSelectModal(true);
        }
      };

      const handleUpdatePasscode = async (newPass) => {
        if (!newPass) return;
        if (supabaseClient) {
          await supabaseClient.from('app_settings').upsert([{ id: 1, shared_password: newPass }]);
        }
        setPasscode(newPass);
        localStorage.setItem('app_shared_passcode', newPass);
        alert('공동 비밀번호가 변경되었습니다!');
      };

      const filteredExpenses = useMemo(() => {
        return expenses.filter(e => {
          if (e.is_deleted) return false;
          if (selectedUserFilter !== 'all' && e.user_id !== selectedUserFilter) return false;
          if (selectedMonth && !e.date.startsWith(selectedMonth)) return false;
          if (searchTerm) {
            const term = searchTerm.toLowerCase();
            const userName = users.find(u => u.id === e.user_id)?.name || '';
            return e.content.toLowerCase().includes(term) || userName.toLowerCase().includes(term) || String(e.amount).includes(term) || e.date.includes(term);

          return true;
        });
      }, [expenses, selectedUserFilter, selectedMonth, searchTerm, users]);

        if (expenseViewMode === 'daily') {
          const groups = {};
          filteredExpenses.forEach(exp => {
            if (!groups[exp.date]) groups[exp.date] = [];
            groups[exp.date].push(exp);
          });
          return Object.keys(groups).sort().reverse().map(dateKey => ({
            key: dateKey,
            title: dateKey,
            total: groups[dateKey].reduce((s, e) => s + Number(e.amount), 0),
            items: groups[dateKey]
          }));
        } else {
          const groups = {};
          filteredExpenses.forEach(exp => {
            const monthKey = exp.date.substring(0, 7);
            if (!groups[monthKey]) groups[monthKey] = [];
            groups[monthKey].push(exp);
          });
          return Object.keys(groups).sort().reverse().map(monthKey => ({
            key: monthKey,
            title: `${monthKey}월 전체`,

                          </div>

            {/* TAB 2: PURCHASE REQUESTS & APPROVALS */}

                  ) : (

                      return (

                                  {statusInfo.label}

                    <input 
                      type="date" 
                      id="editExpDate" 
                      defaultValue={showEditExpenseModal.date}
                      className="w-full mt-1 bg-slate-50 border rounded-xl p-3 text-sm focus:outline-emerald-500"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-600">메모</label>
                    <input 
                      type="text" 
                      id="editExpMemo" 
                      defaultValue={showEditExpenseModal.memo}
                      className="w-full mt-1 bg-slate-50 border rounded-xl p-3 text-sm focus:outline-emerald-500"
                    />
                  </div>
                </div>

                <button 
                  onClick={() => {
                    const content = document.getElementById('editExpContent').value;
                    const amount = document.getElementById('editExpAmount').value;
                    const date = document.getElementById('editExpDate').value;
                    const memo = document.getElementById('editExpMemo').value;
                    handleUpdateExpense(showEditExpenseModal.id, content, amount, date, memo);
                  }}
                  className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3.5 rounded-2xl shadow-md transition"
                >
                  수정 완료
                </button>
              </div>
            </div>
          )}

          {showDbSettingsModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base text-slate-800">🔗 Supabase DB 연동 설정</h3>
                  <button onClick={() => setShowDbSettingsModal(false)} className="text-slate-400">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-600">Supabase URL</label>
                    <input 
                      type="text" 
                      placeholder="https://xxxx.supabase.co"
                      value={supabaseUrl}
                      onChange={(e) => setSupabaseUrl(e.target.value)}
                      className="w-full mt-1 bg-slate-50 border rounded-xl p-2.5 focus:outline-emerald-500"
                    />
                  </div>
                  <div>
                    <label className="font-bold text-slate-600">Supabase Anon Key</label>
                    <input 
                      type="password" 
                      placeholder="eyJhbGciOi..."
                      value={supabaseKey}
                      onChange={(e) => setSupabaseKey(e.target.value)}
                      className="w-full mt-1 bg-slate-50 border rounded-xl p-2.5 focus:outline-emerald-500"
                    />
                  </div>
                </div>

                <div className="flex space-x-2 pt-2">
                  <button 
                    onClick={() => {
                      localStorage.setItem('supabase_url', supabaseUrl);
                      localStorage.setItem('supabase_key', supabaseKey);
                      setShowDbSettingsModal(false);
                      alert('저장되었습니다!');
                      window.location.reload();
                    }}
                    className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3 rounded-2xl shadow-md text-xs"
                  >
                    저장 및 적용
                  </button>
                  <button 
                    onClick={() => {
                      setSupabaseUrl('');
                      setSupabaseKey('');
                      localStorage.removeItem('supabase_url');
                      localStorage.removeItem('supabase_key');
                      setShowDbSettingsModal(false);
                      alert('연동이 해제되었습니다 (로컬 데모 모드)');
                      window.location.reload();
                    }}
                    className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold p-3 rounded-2xl text-xs"
                  >
                    연동 해제
                  </button>
                </div>
              </div>
            </div>
          )}

          {showAddUserModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
                <h3 className="font-bold text-base text-slate-800">👤 새 친구 추가</h3>
                <div className="space-y-3">
                  <input 
                    type="text" 
                    id="newUserNameInput" 
                    placeholder="친구 이름 (예: 지민)"
                    className="w-full bg-slate-50 border rounded-xl p-3 text-sm focus:outline-emerald-500"
                  />
                  <input 
                    type="password" 
                    id="newUserPassInput" 
                    placeholder="초기 개인 비밀번호 (기본: 1234)"
                    className="w-full bg-slate-50 border rounded-xl p-3 text-sm focus:outline-emerald-500"
                  />
                </div>
                <div className="flex space-x-2">
                  <button onClick={() => setShowAddUserModal(false)} className="flex-1 bg-slate-200 text-slate-700 font-bold p-3 rounded-2xl">취소</button>
                  <button 
                    onClick={() => {
                      const name = document.getElementById('newUserNameInput').value;
                      const pass = document.getElementById('newUserPassInput').value;
                      handleAddUser(name, pass);
                    }}
                    className="flex-1 bg-emerald-600 text-white font-bold p-3 rounded-2xl shadow-md"
                  >
                    추가
                  </button>
                </div>
              </div>
            </div>
          )}

          {showEditProfileModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base text-slate-800">⚙️ 프로필 및 비밀번호 변경</h3>
                  <button onClick={() => setShowEditProfileModal(false)} className="text-slate-400">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-slate-600">이름</label>
                    <input 
                      type="text" 
                      id="editProfileName" 
                      defaultValue={currentUser?.name}
                      className="w-full mt-1 bg-slate-50 border rounded-xl p-3 text-sm focus:outline-emerald-500"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-600">새 개인 비밀번호</label>
                    <input 
                      type="password" 
                      id="editProfilePass" 
                      placeholder="변경할 비밀번호 변경"
                      className="w-full mt-1 bg-slate-50 border rounded-xl p-3 text-sm focus:outline-emerald-500"
                    />
                  </div>
                </div>
                <button 
                  onClick={() => {
                    const name = document.getElementById('editProfileName').value;
                    const pass = document.getElementById('editProfilePass').value;
                    handleUpdateMyProfile(name, pass);
                  }}
                  className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3.5 rounded-2xl shadow-md transition"
                >
                  변경 저장
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
